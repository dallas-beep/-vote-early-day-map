<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote Early Day Event Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .container { display: flex; gap: 1.5rem; margin: 0; height: 100vh; padding: 1rem; }
    .left-panel { flex: 0 0 280px; }
    .right-panel { flex: 1; }
    .search-controls { display: flex; flex-direction: column; gap: 12px; }
    .search-controls input, .search-controls select { padding: 12px 14px; border: 2px solid #6cb090; border-radius: 4px; font-size: 14px; background: white; color: #333; }
    .search-controls input::placeholder { color: #999; }
    .search-controls input:focus, .search-controls select:focus { outline: none; border-color: #551b7a; }
    .button-row { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px 14px; border: 2px solid #551b7a; background: #551b7a; color: white; cursor: pointer; font-size: 13px; font-weight: 600; border-radius: 4px; }
    button:hover { background: #6cb090; border-color: #6cb090; }
    .map-container { height: calc(100vh - 2rem); border: 2px solid #551b7a; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="search-controls">
        <input type="text" id="cityInput" placeholder="City">
        <input type="text" id="stateInput" placeholder="State">
        <input type="text" id="zipInput" placeholder="Zip code">
        <select id="radiusSelect">
          <option value="">Select distance radius</option>
          <option value="1">Less than 1 mile</option>
          <option value="5">5 miles</option>
          <option value="10">10 miles</option>
          <option value="15">15 miles</option>
          <option value="20">20 miles</option>
          <option value="25">25 miles</option>
        </select>
        <div class="button-row">
          <button onclick="filterEvents()">Search</button>
          <button onclick="clearFilters()">Clear</button>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="map-container" id="map"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
